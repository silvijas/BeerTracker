<title>pairing icons</title>

  .n { margin-top:2px; font-size:10px; color:#444; }
  h3 { font-size:12px; margin:14px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid #bbb; border-radius:99px; padding:5px 11px; font-size:13px; }
</style>
